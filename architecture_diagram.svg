<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11900" />
      <stop offset="100%" stop-color="#ff4d30" />
    </linearGradient>
    <linearGradient id="paytmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002e6e" />
      <stop offset="100%" stop-color="#00b9f5" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e11900" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff4d30" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="75" cy="65" r="14" fill="#e11900" filter="url(#redGlow)" />
  <text x="105" y="62" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.02em">Airtel SYNC · Project Udyam Digital</text>
  <text x="105" y="82" fill="#94a3b8" font-size="12">End-to-End Solution Architecture &amp; Data Flow Diagram (Enterprise Track A)</text>
  <rect x="1000" y="48" width="130" height="32" rx="16" fill="#e11900" fill-opacity="0.15" stroke="#e11900" stroke-width="1" />
  <text x="1065" y="69" fill="#ff4d30" font-size="11" font-weight="600" text-anchor="middle">DPDP COMPLIANT</text>

  <!-- LAYER 1: CLIENT FRONTEND (PORTALS) -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="320" height="580" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="0" y="0" width="320" height="42" rx="14" fill="#1e293b" />
    <text x="20" y="27" fill="#f8fafc" font-size="14" font-weight="700">1. PRESENTATION LAYER (React 19 + Vite)</text>

    <!-- Sub-Box 1: Owner Portal -->
    <rect x="15" y="58" width="290" height="230" rx="10" fill="#0b1120" stroke="#e11900" stroke-width="1.5" />
    <text x="30" y="84" fill="#ff4d30" font-size="13" font-weight="700">🏪 SMB Owner Portal (Mobile First)</text>
    <text x="30" y="104" fill="#cbd5e1" font-size="11">• 4-Step Conversational Onboarding (Chips + Voice)</text>
    <text x="30" y="122" fill="#cbd5e1" font-size="11">• English / Hindi Regional Language Switch</text>
    <text x="30" y="140" fill="#cbd5e1" font-size="11">• Real-time Interactive Bundle Quote &amp; Add-ons</text>
    <text x="30" y="158" fill="#cbd5e1" font-size="11">• Smart KYC Document Capture (Camera / File)</text>
    <text x="30" y="176" fill="#cbd5e1" font-size="11">• Paytm Sandbox One-Touch UPI &amp; AutoPay</text>
    <text x="30" y="194" fill="#cbd5e1" font-size="11">• 5-Stage Live Order Tracker Timeline</text>
    <text x="30" y="212" fill="#cbd5e1" font-size="11">• "Ask About My Order" AI Support Assistant</text>
    <rect x="30" y="235" width="260" height="36" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="160" y="258" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Auth: Supabase / OAuth 2.0 (SSO)</text>

    <!-- Sub-Box 2: Ops Console -->
    <rect x="15" y="305" width="290" height="255" rx="10" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
    <text x="30" y="332" fill="#38bdf8" font-size="13" font-weight="700">🛡️ Sales Ops &amp; Field Partner Console</text>
    <text x="30" y="354" fill="#cbd5e1" font-size="11">• 5,000 SMB Leads Analytics Dashboard</text>
    <text x="30" y="374" fill="#cbd5e1" font-size="11">• Funnel Dropout Analysis (Apr–Jun 2026)</text>
    <text x="30" y="394" fill="#cbd5e1" font-size="11">• ML-Driven Propensity Priority Queue</text>
    <text x="30" y="414" fill="#cbd5e1" font-size="11">• "Call These 20 First" Stuck-Lead Nudges</text>
    <text x="30" y="434" fill="#cbd5e1" font-size="11">• Field Force Assisted Onboarding Mode</text>
    <text x="30" y="454" fill="#cbd5e1" font-size="11">• Channel Partner Commission &amp; Tracking</text>
    <rect x="30" y="485" width="260" height="40" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="160" y="510" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle">Target: &lt;3 Days Activation | &lt;₹8k CAC</text>
  </g>

  <!-- LAYER 2: BACKEND & BUSINESS LOGIC (FASTAPI) -->
  <g transform="translate(420, 125)">
    <rect x="0" y="0" width="370" height="580" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="0" y="0" width="370" height="42" rx="14" fill="#1e293b" />
    <text x="20" y="27" fill="#f8fafc" font-size="14" font-weight="700">2. APPLICATION LAYER (FastAPI Python 3.12)</text>

    <!-- Module A: Grok AI & Recommendation -->
    <rect x="15" y="58" width="340" height="115" rx="10" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2" />
    <text x="30" y="82" fill="#fbbf24" font-size="12" font-weight="700">🤖 Grok AI &amp; Product Catalogue Rules Engine</text>
    <text x="30" y="102" fill="#94a3b8" font-size="10.5">• Evaluates 25 Products &amp; Enforces Dependencies in Code</text>
    <text x="30" y="118" fill="#94a3b8" font-size="10.5">• City Tier, Staff Count, Sites &amp; GSTIN Validation</text>
    <text x="30" y="134" fill="#94a3b8" font-size="10.5">• Natural Language Justifications (English / Hindi)</text>
    <text x="30" y="150" fill="#94a3b8" font-size="10.5">• Propensity Score Modeling (0–100 Intent Scoring)</text>

    <!-- Module B: Smart KYC & DPDP Act 2023 -->
    <rect x="15" y="185" width="340" height="125" rx="10" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
    <text x="30" y="209" fill="#34d399" font-size="12" font-weight="700">🔍 Smart KYC OCR &amp; Verification Pipeline</text>
    <text x="30" y="229" fill="#94a3b8" font-size="10.5">• Tesseract OCR (GSTIN, Udyam, ID, Electricity Bill)</text>
    <text x="30" y="245" fill="#94a3b8" font-size="10.5">• OpenCV Laplacian Blur Detection (Var &lt; 60)</text>
    <text x="30" y="261" fill="#94a3b8" font-size="10.5">• 90-Day Freshness Check against 2026-07-15</text>
    <text x="30" y="277" fill="#94a3b8" font-size="10.5">• DPDP Consent, Purpose Limitation &amp; 30d Retention</text>
    <text x="30" y="293" fill="#94a3b8" font-size="10.5">• Flags Mismatches, Expired Docs &amp; Suspended GST</text>

    <!-- Module C: Paytm Payment Gateway -->
    <rect x="15" y="322" width="340" height="105" rx="10" fill="#0b1120" stroke="#00b9f5" stroke-width="1.2" />
    <text x="30" y="346" fill="#38bdf8" font-size="12" font-weight="700">💳 Paytm Payment Gateway (Sandbox)</text>
    <text x="30" y="366" fill="#94a3b8" font-size="10.5">• Transaction Token &amp; Checksum Generation</text>
    <text x="30" y="382" fill="#94a3b8" font-size="10.5">• DeepLink UPI Intent &amp; Sandbox Dynamic QR</text>
    <text x="30" y="398" fill="#94a3b8" font-size="10.5">• Instant Server-to-Server Webhook Callback</text>
    <text x="30" y="414" fill="#94a3b8" font-size="10.5">• UPI AutoPay Recurring Mandate Provisioning</text>

    <!-- Module D: Order State Machine & AI Chat -->
    <rect x="15" y="440" width="340" height="118" rx="10" fill="#0b1120" stroke="#a855f7" stroke-width="1.2" />
    <text x="30" y="464" fill="#c084fc" font-size="12" font-weight="700">📦 Order State Machine &amp; Tracker AI</text>
    <text x="30" y="484" fill="#94a3b8" font-size="10.5">• Order Lifecycle: Placed ➔ KYC ➔ Paid ➔ Dispatched</text>
    <text x="30" y="500" fill="#94a3b8" font-size="10.5">• Field Engineer Assignment &amp; ETA Calculation</text>
    <text x="30" y="516" fill="#94a3b8" font-size="10.5">• Contextual AI Order Bot (Kills 3x Follow-Up Calls)</text>
    <text x="30" y="532" fill="#94a3b8" font-size="10.5">• Automated SMS &amp; WhatsApp Notification Events</text>
  </g>

  <!-- LAYER 3: DATA & EXTERNAL INTEGRATIONS -->
  <g transform="translate(850, 125)">
    <rect x="0" y="0" width="310" height="580" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)"/>
    <rect x="0" y="0" width="310" height="42" rx="14" fill="#1e293b" />
    <text x="20" y="27" fill="#f8fafc" font-size="14" font-weight="700">3. DATA &amp; REGISTRY INTEGRATIONS</text>

    <!-- Registry Box 1: Mock GSTIN Registry -->
    <rect x="15" y="58" width="280" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="30" y="82" fill="#f8fafc" font-size="12" font-weight="600">🏛️ Mock GSTIN Registry API</text>
    <text x="30" y="100" fill="#94a3b8" font-size="10.5">• 3,534 Taxpayer Records</text>
    <text x="30" y="116" fill="#94a3b8" font-size="10.5">• Legal Name, Status, Address, Constitution</text>
    <text x="30" y="132" fill="#ef4444" font-size="10.5">• Flags Cancelled &amp; Suspended GSTINs</text>

    <!-- Registry Box 2: Mock Udyam Registry -->
    <rect x="15" y="155" width="280" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="30" y="179" fill="#f8fafc" font-size="12" font-weight="600">📜 Mock Udyam MSME Registry</text>
    <text x="30" y="197" fill="#94a3b8" font-size="10.5">• 2,723 Enterprise Registrations</text>
    <text x="30" y="213" fill="#94a3b8" font-size="10.5">• Enterprise Category (Micro / Small / Medium)</text>
    <text x="30" y="229" fill="#94a3b8" font-size="10.5">• NIC Codes &amp; Activity Classification</text>

    <!-- Registry Box 3: Product Catalogue & Rules -->
    <rect x="15" y="252" width="280" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="30" y="276" fill="#f8fafc" font-size="12" font-weight="600">📊 Product Catalogue CSV (25 Products)</text>
    <text x="30" y="294" fill="#94a3b8" font-size="10.5">• Connectivity, Communication, Cloud, IoT</text>
    <text x="30" y="310" fill="#94a3b8" font-size="10.5">• Pricing, Setup Fees, SLAs, City Tiers</text>
    <text x="30" y="326" fill="#94a3b8" font-size="10.5">• Dependency Mapping (Broadband Prereq)</text>

    <!-- Registry Box 4: Leads Dataset -->
    <rect x="15" y="349" width="280" height="95" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="30" y="373" fill="#f8fafc" font-size="12" font-weight="600">📈 SMB Leads Historical Dataset</text>
    <text x="30" y="391" fill="#94a3b8" font-size="10.5">• 5,000 Verified Quarter Leads (Apr–Jun 2026)</text>
    <text x="30" y="407" fill="#94a3b8" font-size="10.5">• Funnel Stage Transitions &amp; Drop Reasons</text>
    <text x="30" y="423" fill="#94a3b8" font-size="10.5">• Activation Velocity &amp; Acquisition Costs</text>
    <text x="30" y="439" fill="#94a3b8" font-size="10.5">• 6-Month Churn &amp; Net Promoter Scores</text>

    <!-- Registry Box 5: Specimen Documents -->
    <rect x="15" y="456" width="280" height="95" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="30" y="480" fill="#f8fafc" font-size="12" font-weight="600">📁 KYC Specimen Documents (47 Images)</text>
    <text x="30" y="498" fill="#94a3b8" font-size="10.5">• 12 Applicants (K01–K12)</text>
    <text x="30" y="514" fill="#94a3b8" font-size="10.5">• Planted Fraud Tests (Expired, Blurry, Mismatched)</text>
    <text x="30" y="530" fill="#94a3b8" font-size="10.5">• Ingested via OCR &amp; Vision Pipelines</text>
  </g>

  <!-- Connective Arrows & Data Flows -->
  <!-- Layer 1 to Layer 2 -->
  <path d="M 360 220 L 420 220" stroke="#ff4d30" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 420 250 L 360 250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  
  <path d="M 360 440 L 420 440" stroke="#ff4d30" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 420 470 L 360 470" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 2 to Layer 3 -->
  <path d="M 790 190 L 850 190" stroke="#ff4d30" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 850 210 L 790 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <path d="M 790 390 L 850 390" stroke="#ff4d30" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 850 410 L 790 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Footer Legend -->
  <text x="600" y="735" fill="#64748b" font-size="12" text-anchor="middle">
    Architecture conforms strictly to Airtel SYNC Track A Requirements: Sub-3-day activation, DPDP 2023 compliance, Grok AI bundles &amp; Paytm Sandbox AutoPay.
  </text>
</svg>
